<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5ef">
    <title>带上 · 交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5ef;
        --surface: #fffdf8;
        --surface-soft: #f2efe7;
        --text: #20241f;
        --muted: #6f756e;
        --line: #dedbd1;
        --green: #4f8468;
        --green-dark: #3d6f56;
        --green-soft: #e6f0e9;
        --shadow: 0 24px 70px rgba(42, 51, 43, 0.15);
      }

      * { box-sizing: border-box; }

      html { background: #ecefe9; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at 50% 10%, rgba(255,255,255,.9), transparent 38%),
          #ecefe9;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      }

      button, input, select { font: inherit; }
      button { color: inherit; }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .phone {
        position: relative;
        width: 100%;
        min-height: 100dvh;
        overflow-x: hidden;
        background: var(--bg);
      }

      .screen {
        min-height: 100dvh;
        padding: max(22px, env(safe-area-inset-top)) 20px calc(116px + env(safe-area-inset-bottom));
      }

      .screen--home { padding-bottom: 34px; }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        margin-bottom: 24px;
      }

      .brand {
        margin: 0;
        color: var(--green);
        font-size: 25px;
        font-weight: 800;
        letter-spacing: .06em;
      }

      .text-button, .icon-button, .scene-card, .item-row, .quiet-button, .primary-button, .secondary-button {
        border: 0;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .text-button {
        padding: 10px 4px;
        background: transparent;
        font-weight: 650;
      }

      .icon-button {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border-radius: 50%;
        background: transparent;
        font-size: 25px;
      }

      .icon-button:hover, .icon-button:focus-visible { background: var(--surface-soft); }

      h1 {
        margin: 0;
        font-size: clamp(30px, 8vw, 38px);
        line-height: 1.15;
        letter-spacing: -.04em;
      }

      .lead {
        margin: 12px 0 30px;
        color: var(--muted);
        font-size: 16px;
      }

      .notice {
        margin: -10px 0 20px;
        padding: 12px 14px;
        border-radius: 14px;
        color: var(--green-dark);
        background: var(--green-soft);
        font-size: 14px;
      }

      .scene-list { display: grid; gap: 14px; }

      .scene-card {
        width: 100%;
        display: grid;
        grid-template-columns: 58px 1fr auto;
        align-items: center;
        gap: 16px;
        min-height: 112px;
        padding: 18px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        box-shadow: 0 8px 26px rgba(61, 70, 61, .04);
        transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
      }

      .scene-card:hover, .scene-card:focus-visible {
        transform: translateY(-2px);
        border-color: #9bb7a5;
        box-shadow: 0 14px 34px rgba(61, 84, 69, .09);
        outline: none;
      }

      .scene-icon {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        color: var(--green);
        border-radius: 18px;
        background: var(--green-soft);
      }

      .scene-icon svg { width: 31px; height: 31px; }
      .scene-name { display: block; margin-bottom: 6px; font-size: 20px; font-weight: 760; }
      .scene-count { color: var(--muted); font-size: 14px; }
      .arrow { color: var(--green); font-size: 30px; font-weight: 300; }

      .create-scene {
        width: 100%;
        margin-top: 20px;
        min-height: 56px;
        border: 1.5px dashed #90ad99;
        border-radius: 18px;
        color: var(--green-dark);
        background: transparent;
        font-weight: 720;
        cursor: pointer;
      }

      .checklist-head {
        display: grid;
        grid-template-columns: 42px 1fr 42px;
        align-items: center;
        margin-bottom: 22px;
      }

      .checklist-head h1 { text-align: center; font-size: 22px; letter-spacing: 0; }

      details.more { position: relative; }
      details.more summary { list-style: none; }
      details.more summary::-webkit-details-marker { display: none; }

      .more-popover {
        position: absolute;
        z-index: 5;
        top: 46px;
        right: 0;
        width: 178px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 16px 44px rgba(40, 48, 41, .16);
      }

      .more-popover button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        text-align: left;
        background: transparent;
        cursor: pointer;
      }

      .more-popover button:hover { background: var(--surface-soft); }
      .more-popover .danger { color: #9b4f47; }

      .progress-line {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 9px;
      }

      .progress-line strong { font-size: 20px; }
      .progress-line span { color: var(--muted); font-size: 14px; }

      .progress-track {
        height: 6px;
        margin-bottom: 26px;
        overflow: hidden;
        border-radius: 99px;
        background: #e5e1d7;
      }

      .progress-fill { height: 100%; border-radius: inherit; background: var(--green); transition: width .22s ease; }

      .group { margin-bottom: 20px; }
      .group h2 { margin: 0 0 8px 4px; color: #525850; font-size: 14px; letter-spacing: .08em; }

      .items {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
      }

      .item-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 57px;
        padding: 11px 14px;
        text-align: left;
        background: transparent;
      }

      .item-row + .item-row { border-top: 1px solid #ece9e1; }
      .item-row:hover { background: #faf8f2; }

      .check {
        flex: 0 0 auto;
        display: grid;
        width: 25px;
        height: 25px;
        place-items: center;
        border: 1.8px solid #9ca29b;
        border-radius: 50%;
        color: transparent;
        font-size: 15px;
        font-weight: 800;
      }

      .item-row[aria-checked="true"] .check { color: white; border-color: var(--green); background: var(--green); }
      .item-copy { flex: 1; }
      .item-copy strong { font-size: 16px; font-weight: 650; }
      .item-row[aria-checked="true"] .item-copy strong { color: #5f675f; }
      .temporary { margin-left: 8px; color: var(--green-dark); font-size: 12px; font-weight: 700; }

      .empty-list {
        padding: 42px 22px;
        border: 1px dashed #a8b8ab;
        border-radius: 20px;
        text-align: center;
        background: rgba(255,255,255,.35);
      }

      .empty-list strong { display: block; margin-bottom: 8px; font-size: 18px; }
      .empty-list span { color: var(--muted); font-size: 14px; }

      .bottom-actions {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
        border-top: 1px solid rgba(216, 214, 205, .9);
        background: rgba(247, 245, 239, .96);
        backdrop-filter: blur(14px);
      }

      .quiet-button, .primary-button, .secondary-button {
        width: 100%;
        min-height: 52px;
        border-radius: 16px;
        font-weight: 760;
      }

      .quiet-button { margin-bottom: 9px; color: var(--green-dark); background: transparent; }
      .primary-button { color: white; background: var(--green); box-shadow: 0 10px 24px rgba(79, 132, 104, .22); }
      .primary-button:hover, .primary-button:focus-visible { background: var(--green-dark); }
      .secondary-button { color: var(--green-dark); background: transparent; }

      .complete {
        display: flex;
        flex-direction: column;
        min-height: calc(100dvh - 42px);
        padding-top: 72px;
        text-align: center;
      }

      .complete-mark {
        display: grid;
        width: 86px;
        height: 86px;
        margin: 0 auto 32px;
        place-items: center;
        border: 3px solid var(--green);
        border-radius: 50%;
        color: var(--green);
        font-size: 45px;
      }

      .complete h1 { font-size: 28px; letter-spacing: -.02em; }
      .complete-meta { margin: 14px 0 34px; color: var(--muted); }

      .question-card {
        margin: 0 0 28px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 22px;
        text-align: left;
        background: var(--surface);
      }

      .eyebrow { display: block; margin-bottom: 12px; color: var(--green-dark); font-size: 13px; font-weight: 760; }
      .question-card strong { display: block; margin-bottom: 13px; font-size: 21px; }
      .question-card p { margin: 0; color: #4f554f; }
      .complete-actions { margin-top: auto; }

      dialog {
        width: min(calc(100% - 32px), 390px);
        padding: 0;
        border: 0;
        border-radius: 24px;
        color: var(--text);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      dialog::backdrop { background: rgba(28, 33, 29, .42); backdrop-filter: blur(3px); }
      .dialog-body { padding: 22px; }
      .dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
      .dialog-head h2 { margin: 0; font-size: 21px; }
      .dialog-close { border: 0; background: transparent; cursor: pointer; font-size: 25px; }
      label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }

      input, select {
        width: 100%;
        min-height: 50px;
        margin-bottom: 17px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        background: white;
        outline: none;
      }

      input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(79, 132, 104, .12); }
      .history-empty { padding: 22px 0 12px; text-align: center; color: var(--muted); }

      :focus-visible { outline: 3px solid rgba(79, 132, 104, .3); outline-offset: 2px; }

      @media (min-width: 700px) {
        .stage { padding: 28px; }
        .phone {
          width: 390px;
          min-height: 0;
          height: min(844px, calc(100vh - 56px));
          overflow-y: auto;
          border: 9px solid #171a18;
          border-radius: 46px;
          box-shadow: var(--shadow);
        }
        .screen { min-height: 100%; }
        .complete { min-height: calc(100% - 42px); }
        .phone::-webkit-scrollbar { width: 0; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <main id="app" class="phone" aria-live="polite"></main>
    </div>

    <dialog id="add-dialog" aria-labelledby="add-title">
      <form id="add-form" method="dialog" class="dialog-body">
        <div class="dialog-head">
          <h2 id="add-title">添加物品</h2>
          <button class="dialog-close" type="button" data-close="add-dialog" aria-label="关闭">×</button>
        </div>
        <label for="item-name">物品名称</label>
        <input id="item-name" name="name" placeholder="例如：电脑充电器" autocomplete="off" required>
        <label for="item-group">放在哪一组</label>
        <select id="item-group" name="group">
          <option>数码</option><option>证件</option><option>衣物</option><option>洗漱</option><option>其他</option>
        </select>
        <button class="primary-button" type="submit">添加到清单</button>
      </form>
    </dialog>

    <dialog id="custom-dialog" aria-labelledby="custom-title">
      <form id="custom-form" method="dialog" class="dialog-body">
        <div class="dialog-head">
          <h2 id="custom-title">创建自己的场景</h2>
          <button class="dialog-close" type="button" data-close="custom-dialog" aria-label="关闭">×</button>
        </div>
        <label for="scene-name">场景名称</label>
        <input id="scene-name" name="name" placeholder="例如：周日骑行" autocomplete="off" required>
        <button class="primary-button" type="submit">开始空白清单</button>
      </form>
    </dialog>

    <dialog id="history-dialog" aria-labelledby="history-title">
      <div class="dialog-body">
        <div class="dialog-head">
          <h2 id="history-title">历史</h2>
          <button class="dialog-close" type="button" data-close="history-dialog" aria-label="关闭">×</button>
        </div>
        <div class="history-empty">原型中还没有完成记录</div>
      </div>
    </dialog>

    <script type="module">
      import {
        SCENES,
        addItem,
        createInitialState,
        openCompletion,
        resolveAddedItem,
        startCustomScene,
        startScene,
        toggleItem,
      } from './prototype-state.mjs';

      const app = document.querySelector('#app');
      const addDialog = document.querySelector('#add-dialog');
      const customDialog = document.querySelector('#custom-dialog');
      const historyDialog = document.querySelector('#history-dialog');
      let state = createInitialState();

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

      const icon = (type) => {
        if (type === 'case') return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="9" width="24" height="17" rx="4"/><path d="M11 9V6.5A2.5 2.5 0 0 1 13.5 4h5A2.5 2.5 0 0 1 21 6.5V9M4 16h24M14 16v3h4v-3"/></svg>';
        if (type === 'suitcase') return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="6" width="18" height="22" rx="4"/><path d="M12 6V3h8v3M12 10v14M20 10v14M10 28v2M22 28v2"/></svg>';
        return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 10V7a6 6 0 0 1 12 0v3"/><rect x="5" y="10" width="22" height="18" rx="5"/><path d="M10 16v6M22 16v6"/></svg>';
      };

      function renderHome() {
        const cards = Object.values(SCENES).map((scene) => `
          <button class="scene-card" type="button" data-scene="${scene.id}" aria-label="${scene.name}，${scene.items.length} 件物品">
            <span class="scene-icon" aria-hidden="true">${icon(scene.icon)}</span>
            <span><span class="scene-name">${scene.name}</span><span class="scene-count">${scene.items.length} 件物品</span></span>
            <span class="arrow" aria-hidden="true">›</span>
          </button>`).join('');

        return `<section class="screen screen--home">
          <header class="topbar"><p class="brand">带上</p><button class="text-button" type="button" data-action="history">历史</button></header>
          <h1>这次要去哪？</h1>
          <p class="lead">选择一个场景，马上开始准备</p>
          ${state.notice ? `<p class="notice" role="status">${escapeHtml(state.notice)}</p>` : ''}
          <div class="scene-list">${cards}</div>
          <button class="create-scene" type="button" data-action="custom">＋ 创建自己的场景</button>
        </section>`;
      }

      function renderChecklist() {
        const scene = state.activeScene;
        const checked = scene.items.filter((entry) => entry.checked).length;
        const total = scene.items.length;
        const progress = total ? Math.round((checked / total) * 100) : 0;
        const groups = [...new Set(scene.items.map((entry) => entry.group))];
        const groupedItems = groups.map((group) => `
          <section class="group">
            <h2>${escapeHtml(group)}</h2>
            <div class="items">${scene.items.filter((entry) => entry.group === group).map((entry) => `
              <button class="item-row" type="button" role="checkbox" aria-checked="${entry.checked}" data-item="${entry.id}">
                <span class="check" aria-hidden="true">✓</span>
                <span class="item-copy"><strong>${escapeHtml(entry.name)}</strong>${entry.temporary ? '<span class="temporary">本次新增</span>' : ''}</span>
              </button>`).join('')}</div>
          </section>`).join('');

        return `<section class="screen">
          <header class="checklist-head">
            <button class="icon-button" type="button" data-action="back" aria-label="返回">‹</button>
            <h1>${escapeHtml(scene.name)}</h1>
            <details class="more"><summary class="icon-button" aria-label="更多操作">•••</summary><div class="more-popover">
              <button type="button" data-action="restart">重新开始</button>
              <button class="danger" type="button" data-action="abandon">放弃本次准备</button>
            </div></details>
          </header>
          <div class="progress-line"><strong>${checked} / ${total}</strong><span>已准备</span></div>
          <div class="progress-track" role="progressbar" aria-label="准备进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><div class="progress-fill" style="width:${progress}%"></div></div>
          ${total ? groupedItems : '<div class="empty-list"><strong>清单还是空的</strong><span>先添加第一件要带的东西吧</span></div>'}
          <div class="bottom-actions">
            <button class="quiet-button" type="button" data-action="add">＋ 添加物品</button>
            <button class="primary-button" type="button" data-action="finish">完成准备</button>
          </div>
        </section>`;
      }

      function renderComplete() {
        const scene = state.activeScene;
        const total = scene.items.length;
        const question = state.addedItem ? `
          <div class="question-card"><span class="eyebrow">本次新增</span><strong>${escapeHtml(state.addedItem.name)}</strong><p>以后${escapeHtml(scene.name)}也带它吗？</p></div>
          <div class="complete-actions"><button class="primary-button" type="button" data-action="keep">以后也带</button><button class="secondary-button" type="button" data-action="once">仅本次</button></div>` : `
          <div class="complete-actions"><button class="primary-button" type="button" data-action="once">返回首页</button></div>`;

        return `<section class="screen complete">
          <div class="complete-mark" aria-hidden="true">✓</div>
          <h1>准备完成，可以出发了</h1>
          <p class="complete-meta">${escapeHtml(scene.name)} · ${total} 件物品</p>
          ${question}
        </section>`;
      }

      function render() {
        app.innerHTML = state.screen === 'home' ? renderHome() : state.screen === 'checklist' ? renderChecklist() : renderComplete();
      }

      app.addEventListener('click', (event) => {
        const target = event.target.closest('button, summary');
        if (!target) return;
        if (target.dataset.scene) state = startScene(state, target.dataset.scene);
        else if (target.dataset.item) state = toggleItem(state, target.dataset.item);
        else if (target.dataset.action === 'add') { addDialog.showModal(); requestAnimationFrame(() => document.querySelector('#item-name').focus()); return; }
        else if (target.dataset.action === 'finish') state = openCompletion(state);
        else if (target.dataset.action === 'keep') state = resolveAddedItem(state, true);
        else if (target.dataset.action === 'once') state = resolveAddedItem(state, false);
        else if (target.dataset.action === 'back') state = createInitialState();
        else if (target.dataset.action === 'abandon') state = { ...createInitialState(), notice: '已放弃本次准备' };
        else if (target.dataset.action === 'restart') state = state.activeScene.id === 'custom' ? startCustomScene(createInitialState(), state.activeScene.name) : startScene(createInitialState(), state.activeScene.id);
        else if (target.dataset.action === 'history') { historyDialog.showModal(); return; }
        else if (target.dataset.action === 'custom') { customDialog.showModal(); requestAnimationFrame(() => document.querySelector('#scene-name').focus()); return; }
        else return;
        render();
      });

      document.querySelector('#add-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        state = addItem(state, data.get('name'), data.get('group'));
        event.currentTarget.reset();
        addDialog.close();
        render();
      });

      document.querySelector('#custom-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        state = startCustomScene(state, data.get('name'));
        event.currentTarget.reset();
        customDialog.close();
        render();
      });

      document.addEventListener('click', (event) => {
        const close = event.target.closest('[data-close]');
        if (close) document.querySelector(`#${close.dataset.close}`).close();
      });

      render();
    </script>
  </body>
</html>
